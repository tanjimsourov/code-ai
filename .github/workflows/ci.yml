name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e .[dev,postgres,channels_redis]
      - name: Compile
        run: python -m compileall -q .
      - name: Django Check
        run: python manage.py check --settings=config.settings.local --fail-level WARNING
      - name: Makemigrations Check
        run: python manage.py makemigrations --settings=config.settings.local --check --dry-run
      - name: Fresh Migrate
        run: |
          rm -f /tmp/code_editor_fresh.sqlite3
          python manage.py migrate --settings=config.settings.local --noinput
      - name: Smoke Check
        run: python manage.py code_editor_smoke_check --settings=config.settings.local
      - name: Install Validation
        run: python manage.py code_editor_validate_install --settings=config.settings.local
      - name: Tests
        run: pytest -q
